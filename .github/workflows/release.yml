name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching pyproject.toml
        required: true
        default: v0.8.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag and package version disagree'
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/make_release.py
      - name: Publish GitHub Release
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" --title "autodl ${RELEASE_TAG#v}" \
            --notes-file docs/RELEASE_NOTES.md --latest
